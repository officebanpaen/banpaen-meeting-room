<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>แบบฟอร์มการขออนุญาตใช้ห้องประชุม</title>

<style>
@page{size:A4 portrait;margin:0;}

html,body{
  margin:0;
  padding:0;
  background:#ddd;
  font-family:"TH SarabunPSK","TH Sarabun New",sans-serif;
}

.page{
  position:relative;
  width:210mm;
  height:297mm;
  margin:0 auto;
  background:#fff;
  overflow:hidden;
}

.bg{
  position:absolute;
  left:0;
  top:0;
  width:210mm;
  height:297mm;
  z-index:1;
}

.fill{
  position:absolute;
  z-index:2;
  font-size:18pt;
  color:#000;
  white-space:nowrap;
}

.check{
  position:absolute;
  z-index:2;
  font-size:20pt;
  font-weight:bold;
}

.no-print{
  position:fixed;
  top:10px;
  left:10px;
  z-index:99;
  padding:8px 14px;
  font-size:16px;
}

@media print{
  html,body{background:#fff;}
  .page{margin:0;}
  .no-print{display:none;}
}
</style>
</head>

<body>

<button class="no-print" onclick="window.print()">🖨️ พิมพ์</button>

<div class="page">
  <img class="bg" src="form_bg.jpg">

  <!-- ข้อมูลด้านบน -->
  <div class="fill" id="dept" style="left:55mm; top:45mm;"></div>

  <div class="fill" id="dayUse" style="left:50mm; top:56mm;"></div>
  <div class="fill" id="monthUse" style="left:82mm; top:56mm;"></div>
  <div class="fill" id="yearUse" style="left:128mm; top:56mm;"></div>

  <div class="fill" id="note" style="left:45mm; top:65mm;"></div>

  <div class="fill" id="people" style="left:55mm; top:74mm;">-</div>
  <div class="fill" id="start" style="left:108mm; top:74mm;"></div>
  <div class="fill" id="end" style="left:153mm; top:74mm;"></div>

  <!-- ห้องประชุม -->
  <div class="check" id="roomBig" style="left:20mm; top:87mm;"></div>
  <div class="check" id="roomCouncil" style="left:20mm; top:97mm;"></div>
  <div class="check" id="roomSmall" style="left:118mm; top:87mm;"></div>

  <!-- ผู้ประสานงาน -->
  <div class="fill" id="name" style="left:60mm; top:127mm;"></div>
  <div class="fill" id="tel" style="left:145mm; top:127mm;"></div>
</div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name) || "";
}

function thaiMonth(m){
  const months = [
    "", "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
    "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
  ];
  return months[Number(m)] || "";
}

function setText(id,value){
  const el = document.getElementById(id);
  if(el) el.textContent = value || "-";
}

const name = getParam("name");
const tel = getParam("tel");
const dept = getParam("dept");
const room = getParam("room");
const date = getParam("date");
const start = getParam("start");
const end = getParam("end");
const note = getParam("note");

setText("dept", dept);
setText("note", note);
setText("name", name);
setText("tel", tel);
setText("start", start);
setText("end", end);

if(date){
  const p = date.split("-");
  setText("dayUse", Number(p[2]));
  setText("monthUse", thaiMonth(p[1]));
  setText("yearUse", Number(p[0]) + 543);
}

if(room.includes("ศาลาประชาคม")) document.getElementById("roomBig").textContent = "✓";
if(room.includes("สภา")) document.getElementById("roomCouncil").textContent = "✓";
if(room.includes("เล็ก")) document.getElementById("roomSmall").textContent = "✓";
</script>

</body>
</html>
